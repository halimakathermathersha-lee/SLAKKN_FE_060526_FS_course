<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Login OTP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200">

    <!-- Register Page -->
    <div id="register" class="bg-white w-80 mx-auto mt-10 p-5 rounded shadow">

        <h1 class="text-2xl font-bold mb-3">Register</h1>

        <input
            id="name"
            type="text"
            placeholder="Enter Name"
            class="border w-full p-2 mb-3 rounded">

        <input
            id="email"
            type="email"
            placeholder="Enter Email"
            class="border w-full p-2 mb-3 rounded">

        <input
            id="number"
            type="tel"
            placeholder="Enter Mobile Number"
            class="border w-full p-2 mb-3 rounded">

        <button
            onclick="registerPage()"
            class="bg-blue-500 text-white px-4 py-2 rounded">
            Register
        </button>

    </div>
 <script>
        let dataBase=[]

        function registerPage() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let number = document.getElementById("number").value;

            let obj={name,email,number}

            if (name == "" || email == "" || number == "") {
                alert("Please fill all fields");
            }
            else if (number.length != 10) {
                alert("Enter a valid 10 digit mobile number");
            }
            else {
                dataBase=[obj]
              
                console.log(dataBase);
                
            }
        }

  </script>

</body>
</html>
