    <script>
        //task1
        const arr = [1, 2, 3, 4, 5, 6, 6, 4, 5]

            if (!check.includes(arr[i])) {

        //task2
        const numbers = [10, 45, 22, 78, 56, 78, 34];
        const crt = [...new Set(numbers)]
        const secondLarNum = crt.sort((a, b) => b - a)
        console.log(secondLarNum[1]);
        //task3

        const word = "javascript";

        const countFrequency = (str) => {
            const result = {};

            for (let i = 0; i < str.length; i++) {
                const char = str[i];

                if (result[char]) {
                    result[char]++;
                } else {
                    result[char] = 1;
                }
            }

            return result;
        }

        console.log(countFrequency(word));

        //task4

        const numbers1 = [1, 2, 3, 4, 6, 7, 8, 9, 10];

        for (let i = 0; i < numbers1.length; i++) {
            if (numbers1[i + 1] - numbers1[i] !== 1) {
                console.log(numbers1[i] + 1);
                break;
            }
        }

        //task5
        const word1 = "aabbccddefg";

        function firstNonRepeated(str) {
            const count = {};

            // Count frequency
            for (let i = 0; i < str.length; i++) {
                const char = str[i];

                if (count[char]) {
                    count[char]++;
                } else {
                    count[char] = 1;
                }
            }

            // Find first character with count 1
            for (let i = 0; i < str.length; i++) {
                if (count[str[i]] === 1) {
                    return str[i];
                }
            }
        }

        console.log(firstNonRepeated(word1));

        //task6

        const arr1 = [10, 20, 30, 40];
        const arr2 = [10, 20, 30, 40];

        function checkArraysEqual(arr1, arr2) {

            if (arr1.length !== arr2.length) {
                return "Arrays are Not Equal";
            }

            for (let i = 0; i < arr1.length; i++) {
                if (arr1[i] !== arr2[i]) {
                    return "Arrays are Not Equal";
                }
            }

            return "Arrays are Equal";
        }

        console.log(checkArraysEqual(arr1, arr2));

        //task 
        function availableSeats(bookedSeats) {
            const available = [];

            for (let i = 1; i <= 10; i++) {
                if (!bookedSeats.includes(i)) {
                    available.push(i);
                }
            }

            return available;
        }

        console.log(availableSeats([1, 3, 5, 7]));
    </script>
